<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" font-family="Helvetica, Arial, sans-serif" role="img">
<title>10-inch 1U power panel layout</title>
<desc>Front view of a 254 mm by 44 mm rack panel with rack slots, rocker switch, LED and vents, and a top view of the 210 by 90 mm tray behind it holding a Wago connector, three buck converters, a fuse tie-down, a rear DC jack and four cable exit notches.</desc>
